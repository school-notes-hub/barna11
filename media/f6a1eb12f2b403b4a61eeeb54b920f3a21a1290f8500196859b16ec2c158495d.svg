<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="title desc"><title id="title">Erőrendszer egy tartón</title><desc id="desc">Tartó, amelynek két oldalán hullámos vonal jelzi, hogy csak egy darabja látszik. A felső élén F1 [kN] függőlegesen lefelé, F2 [N] ferdén balra lefelé, F3 [kN] ferdén jobbra lefelé hat, közöttük egy rövid szakaszon q [kN/m] megoszló teher. Alatta az erőrendszer jele: (F1, F2, F3, q).</desc><defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#243746" stroke-width="1.6"/></marker>
<marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#c43d42" stroke-width="1.6"/></marker>
<marker id="comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#16816b" stroke-width="1.6"/></marker>
<marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#546b80" stroke-width="1.6"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2869b0" stroke-width="1.6"/></marker>
</defs><rect width="720" height="100%" rx="18" fill="#f5f9fc"/>
<text x="28" y="39" font-family="Arial, sans-serif" font-size="25" fill="#243746" font-weight="700">Erőrendszer egy tartón</text>
<path d="M75 280 H640 V304 H75 Z" stroke="#243746" stroke-width="2.5" fill="#e2edf3"/>
<path d="M75 304 C50 335 100 355 75 385 S90 426 75 451 M640 304 C615 335 665 355 640 385 S655 426 640 451" stroke="#243746" stroke-width="2.5" fill="none"/>
<path d="M75 430 H640 V451 H75 Z" stroke="#243746" stroke-width="2.5" fill="#e2edf3"/>
<line x1="116" y1="140" x2="116" y2="280" stroke="#c43d42" stroke-width="2.5" marker-end="url(#force)"/>
<text x="48" y="129" font-family="Arial, sans-serif" font-size="20" fill="#c43d42">F<tspan baseline-shift="sub" font-size="70%">1</tspan> [kN]</text>
<line x1="286" y1="146" x2="188" y2="280" stroke="#c43d42" stroke-width="2.5" marker-end="url(#force)"/>
<text x="237" y="132" font-family="Arial, sans-serif" font-size="20" fill="#c43d42">F<tspan baseline-shift="sub" font-size="70%">2</tspan> [N]</text>
<line x1="582" y1="132" x2="629" y2="280" stroke="#c43d42" stroke-width="2.5" marker-end="url(#force)"/>
<text x="563" y="117" font-family="Arial, sans-serif" font-size="20" fill="#c43d42">F<tspan baseline-shift="sub" font-size="70%">3</tspan> [kN]</text>
<line x1="337" y1="230" x2="433" y2="230" stroke="#c43d42" stroke-width="2.5"/>
<line x1="337" y1="230" x2="337" y2="280" stroke="#c43d42" stroke-width="2" marker-end="url(#force)"/>
<line x1="361" y1="230" x2="361" y2="280" stroke="#c43d42" stroke-width="2" marker-end="url(#force)"/>
<line x1="385" y1="230" x2="385" y2="280" stroke="#c43d42" stroke-width="2" marker-end="url(#force)"/>
<line x1="409" y1="230" x2="409" y2="280" stroke="#c43d42" stroke-width="2" marker-end="url(#force)"/>
<line x1="433" y1="230" x2="433" y2="280" stroke="#c43d42" stroke-width="2" marker-end="url(#force)"/>
<text x="320" y="208" font-family="Arial, sans-serif" font-size="20" fill="#c43d42">q [kN/m]</text>
<text x="220" y="485" font-family="Arial, sans-serif" font-size="23" fill="#243746">(F<tspan baseline-shift="sub" font-size="70%">1</tspan>, F<tspan baseline-shift="sub" font-size="70%">2</tspan>, F<tspan baseline-shift="sub" font-size="70%">3</tspan>, q)</text>
</svg>