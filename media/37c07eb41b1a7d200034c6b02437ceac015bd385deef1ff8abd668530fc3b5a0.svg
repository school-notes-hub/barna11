<text x="46" y="407" font-family="Arial, sans-serif" font-size="19" fill="#243746">Javítás (nem a füzetből): F<tspan baseline-shift="sub" font-size="70%">y</tspan> ≈ −12,35 kN.</text>
<text x="46" y="444" font-family="Arial, sans-serif" font-size="17" fill="#243746">Nagysága 12,35 kN; az y tengely lefelé pozitív.</text>
<text x="46" y="478" font-family="Arial, sans-serif" font-size="17" fill="#243746">A füzetben: 12,35 / 12,34 kN.</text>
