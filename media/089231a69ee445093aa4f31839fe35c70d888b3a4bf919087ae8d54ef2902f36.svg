<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img" aria-labelledby="title desc"><title id="title">Vonal mentén megoszló terhek</title><desc id="desc">Saját ábra a füzet 7-9. oldalának látható rajza alapján. A bizonytalanságokat felirat jelöli.</desc><defs>
