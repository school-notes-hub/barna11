<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Erőmérték - a füzet léptékábrája</title>
<desc id="desc">Az 5. füzetoldal két azonos hosszú, végein beosztott szakaszának rekonstrukciója: 1 cm rajzi hosszhoz 1 kN erő tartozik. Ez megfeleltetés, nem centiméter és kilonewton fizikai egyenlősége; a képernyőméret nem hiteles mérce.</desc>
<rect width="900" height="310" rx="18" fill="#f6f8fa"/>
<g font-family="sans-serif" fill="#20394a">
<text x="40" y="46" font-size="25" font-weight="bold">Erőmérték: a rajz léptéke</text>
<text x="40" y="77" font-size="18">A füzet két szakaszának rekonstrukciója</text>
<g stroke="#347659" stroke-width="3"><path d="M180 139H340 M180 127V151 M340 127V151 M180 226H340 M180 214V238 M340 214V238"/></g>
<text x="260" y="122" text-anchor="middle" font-size="24" fill="#246440">1 cm</text>
<text x="260" y="209" text-anchor="middle" font-size="24" fill="#246440">1 kN</text>
<text x="405" y="161" font-size="24">1 cm rajzi hosszhoz</text>
<text x="405" y="198" font-size="24">1 kN erő tartozik.</text>
<text x="40" y="285" font-size="18">Átméretezve a képen látható szakasz hossza megváltozik.</text>
</g></svg>