<path d="M105 260 L255 125 H580 L430 260 Z" stroke="#c43d42" stroke-width="2.5" fill="none"/>
<line x1="330" y1="198" x2="330" y2="288" stroke="#2869b0" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="350" y="110" font-family="Arial, sans-serif" font-size="21" fill="#2869b0">G = g · A</text>
<text x="347" y="232" font-family="Arial, sans-serif" font-size="21" fill="#2869b0">G</text>
<text x="280" y="282" font-family="Arial, sans-serif" font-size="22" fill="#243746">S</text>
<text x="120" y="348" font-family="Arial, sans-serif" font-size="20" fill="#243746">m</text>
<text x="80" y="403" font-family="Arial, sans-serif" font-size="20" fill="#243746">m · g = G: itt g gyorsulás [m/s²]</text>
<text x="80" y="440" font-family="Arial, sans-serif" font-size="22" fill="#c43d42">g = G / A: felületi teher [kN/m²]</text>
<text x="80" y="476" font-family="Arial, sans-serif" font-size="17" fill="#243746">S: súlypont; m: tömeg; A: terület.</text>
<text x="80" y="510" font-family="Arial, sans-serif" font-size="17" fill="#c43d42">Javítás (nem a füzetből): az alsó g nem gyorsulás.</text>
</svg>