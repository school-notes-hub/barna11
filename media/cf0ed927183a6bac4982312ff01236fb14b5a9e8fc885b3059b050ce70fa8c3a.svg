</defs><rect width="900" height="950" fill="#ffffff"/><text x="30" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#1d2433">Hajlat a fal és az aljzat találkozásánál</text><text x="30" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#5a6270">metszet; a lemezvastagság felnagyítva</text><rect x="120" y="120" width="180" height="350" fill="url(#conc)" stroke="#1d2433" stroke-width="2"/><rect x="120" y="470" width="760" height="90" fill="url(#conc)" stroke="#1d2433" stroke-width="2"/><path d="M300 429.5 A40.5 40.5 0 0 0 340.5 470 L300 470 Z" fill="#b9bec6" stroke="#1d2433" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><path d="M304.5 303.80862561759665 L304.5 429.5 A36.0 36.0 0 0 0 340.5 465.5 L466.19137438240335 465.5" fill="none" stroke="#e0662b" stroke-width="9" stroke-linecap="butt" stroke-linejoin="round"/><path d="M313.5 130 L313.5 429.5 A27.0 27.0 0 0 0 340.5 456.5 L860 456.5" fill="none" stroke="#1747a6" stroke-width="9" stroke-linecap="butt" stroke-linejoin="round"/><line x1="286" y1="303.80862561759665" x2="320" y2="303.80862561759665" stroke="#1d2433" stroke-width="2.5"/><line x1="466.19137438240335" y1="484" x2="466.19137438240335" y2="448" stroke="#1d2433" stroke-width="2.5"/><line x1="470" y1="200" x2="313.5" y2="250" stroke="#1d2433" stroke-width="2"/><circle cx="313.5" cy="250" r="4.5" fill="#1d2433"/><circle cx="470" cy="200" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="470" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">1</text><line x1="560" y1="300" x2="426.19137438240335" y2="465.5" stroke="#1d2433" stroke-width="2"/><circle cx="426.19137438240335" cy="465.5" r="4.5" fill="#1d2433"/><circle cx="560" cy="300" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="560" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">2</text><line x1="470" y1="600" x2="304" y2="466" stroke="#1d2433" stroke-width="2"/><circle cx="304" cy="466" r="4.5" fill="#1d2433"/><circle cx="470" cy="600" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="470" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">3</text><circle cx="49" cy="670" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="49" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">1</text><text x="82" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start" fill="#1d2433">szigetelőlemez: toldás nélkül fordul át</text><circle cx="49" cy="714" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="49" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">2</text><text x="82" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start" fill="#1d2433">vértezősáv (hajlaterősítő lemezsáv),</text><text x="82" y="762" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start" fill="#1d2433">30-40 cm széles, a felület mentén mérve</text><circle cx="49" cy="802" r="19" fill="#ffffff" stroke="#1d2433" stroke-width="2.5"/><text x="49" y="812" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2433">3</text><text x="82" y="812" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start" fill="#1d2433">hajlat: 4-5 cm sugarú lekerekítés</text><text x="30" y="880" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#5a6270">A két vonás a vértezősáv két végét jelöli.</text><text x="30" y="920" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#5a6270">Arányos rajz: 4,5 cm sugár, 35 cm-es sáv.</text></svg>