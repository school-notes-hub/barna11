<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title"><title id="title">Három különböző hőterjedési mód, eltérő jelentésű nyilakkal</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="800" rx="12" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif"><text x="25" y="36" font-size="23" text-anchor="start" fill="#263548">1. Hővezetés – energia továbbadása</text><rect x="70" y="85" width="500" height="48" rx="5" fill="#e6edf2" stroke="#8395a2"/><rect x="70" y="85" width="110" height="48" rx="5" fill="#f2b29b" stroke="#8395a2"/><rect x="460" y="85" width="110" height="48" rx="5" fill="#b7d4ed" stroke="#8395a2"/><text x="115" y="72" font-size="20" text-anchor="middle" fill="#263548">meleg</text><text x="515" y="72" font-size="20" text-anchor="middle" fill="#263548">hideg</text><path d="M210 109 L428 109" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="170" font-size="21" text-anchor="middle" fill="#263548">A rúd anyaga nem áramlik végig.</text><text x="25" y="235" font-size="23" text-anchor="start" fill="#263548">2. Hőáramlás – levegő mozog</text><rect x="85" y="265" width="470" height="255" rx="5" fill="#edf3f6" stroke="#8395a2"/><rect x="105" y="390" width="48" height="90" rx="5" fill="#ecac91" stroke="#8395a2"/><text x="179" y="492" font-size="19" text-anchor="start" fill="#263548">fűtés</text><path d="M175 452 L175 305 L493 305 L493 458 L208 458" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="220" y="290" font-size="20" text-anchor="start" fill="#263548">meleg levegő fent</text><text x="245" y="420" font-size="19" text-anchor="start" fill="#263548">lehűlés után vissza</text><text x="25" y="580" font-size="23" text-anchor="start" fill="#263548">3. Hősugárzás – energia érkezik</text><circle cx="100" cy="663" r="37" fill="#edbf53"/><text x="100" y="724" font-size="21" text-anchor="middle" fill="#263548">Nap</text><rect x="440" y="636" width="125" height="60" rx="5" fill="#e7b38c" stroke="#8395a2"/><path d="M155 661 L432 661" stroke="#b64829" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="300" y="643" font-size="21" text-anchor="middle" fill="#263548">sugárzás</text><text x="498" y="724" font-size="21" text-anchor="middle" fill="#263548">felület</text><text x="320" y="768" font-size="21" text-anchor="middle" fill="#263548">Az elnyelt sugárzás melegíti a felületet.</text></g></svg>