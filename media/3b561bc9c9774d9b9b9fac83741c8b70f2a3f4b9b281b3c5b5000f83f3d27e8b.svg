<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">Belső erő: gondolati vágás egy felfüggesztett rúdon</title><desc id="desc">Balra: mennyezetre függesztett rúd, végén teher; a rúdra a mennyezet felfelé ható támaszereje és a lefelé ható teher hat, egyensúlyban. A rudat gondolatban elvágjuk. Jobbra a két rész külön: a felső részre felül a támaszerő, a vágásnál lefelé a belső erő hat; az alsó részre a vágásnál felfelé a belső erő, alul a teher. A két belső erő egyforma és ellentétes irányú. A rúd önsúlyát elhanyagoljuk.</desc><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#196c9c"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b74d2f"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243747"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62788a"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7d4f"/></marker></defs>
