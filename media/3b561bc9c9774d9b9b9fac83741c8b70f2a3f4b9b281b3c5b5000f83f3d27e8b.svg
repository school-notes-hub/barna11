<text x="534" y="630" font-size="23" font-weight="700" text-anchor="start" fill="#b74d2f">teher</text>
<text x="520" y="700" font-size="23" font-weight="700" text-anchor="middle" fill="#243747">a két rész külön</text>
<text x="30" y="748" font-size="22" font-weight="400" text-anchor="start" fill="#243747">A teljes szerkezeten a támaszerő és a teher</text>
<text x="30" y="778" font-size="22" font-weight="400" text-anchor="start" fill="#243747">egyensúlyban van.</text>
<text x="30" y="816" font-size="22" font-weight="400" text-anchor="start" fill="#243747">A vágás két oldalán a belső erők egyformák és</text>
<text x="30" y="846" font-size="22" font-weight="400" text-anchor="start" fill="#243747">ellentétes irányúak; mindkét rész egyensúlyban van.</text>
<text x="30" y="884" font-size="21" font-weight="400" text-anchor="start" fill="#62788a">A rúd önsúlyát elhanyagoljuk.</text>
</g></svg>