<svg xmlns="http://www.w3.org/2000/svg" width="720" height="910" viewBox="0 0 720 910" role="img" aria-labelledby="title desc"><title id="title">Két komponensfeladat</title><desc id="desc">Két kidolgozott példa lefelé pozitív y tengelyű koordináta-rendszerben. 1. példa: a (8; 1) pontból balra-lefelé mutató F = 26 kN erő, α = 150° irányszöggel; balra mutató Fx ≈ −22,52 kN és lefelé mutató Fy = 13 kN komponens; lépték 1 cm ↔ 10 kN, rajzi hossz 2,6 cm. 2. példa: a (7; 4) pontból balra-felfelé mutató F = 47,43 N erő; balra mutató Fx = −45 N és felfelé mutató Fy = −15 N komponens; a kezdőpontnál α = 198,43° irányszög és β hegyesszög a balra mutató vízszintessel, a nyílhegynél γ szög a függőlegessel; lépték 1 cm ↔ 15 N, rajzi hossz ≈ 3,16 cm.</desc><defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#243746" stroke-width="1.6"/></marker>
<marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#c43d42" stroke-width="1.6"/></marker>
