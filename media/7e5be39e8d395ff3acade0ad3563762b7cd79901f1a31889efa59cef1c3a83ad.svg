<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Az erő jellemzői - a füzet 4. oldali rajza</title>
<desc id="desc">Saját rekonstrukció. Négyzetes test; bal oldalán jobbra tartó piros erőnyíl, vízszintes szaggatott hatásvonal. Felül lefelé tartó zöld nyíl. A felső pontba jobbról-felülről érkező piros nyíl, lefelé-balra szaggatott folytatás. A füzet 60 fokot és F = 1 kN feliratot ad, nem minden jelhez külön nagyságot.</desc>
<rect width="900" height="560" rx="18" fill="#f6f8fa"/>
<g font-family="sans-serif" fill="#20394a">
<text x="40" y="46" font-size="25" font-weight="bold">Az erő jellemzői</text>
<text x="40" y="77" font-size="18">A füzet rajzának rekonstrukciója</text>
<rect x="310" y="290" width="160" height="160" fill="#e5edf1" stroke="#20394a" stroke-width="3"/>
<path d="M70 370H785" stroke="#347659" stroke-width="3" stroke-dasharray="16 12"/>
<path d="M195 370H310 M294 357L310 370L294 383" fill="none" stroke="#b63535" stroke-width="4"/>
<path d="M365 148V225 M355 207L365 225L375 207" fill="none" stroke="#347659" stroke-width="3"/>
<defs><marker id="red-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b63535" stroke-width="1.5"/></marker></defs>
<path d="M491.6 140L405 290" stroke="#b63535" stroke-width="4" marker-end="url(#red-force)"/>
<path d="M405 290L355 376.6" stroke="#536977" stroke-width="2" stroke-dasharray="12 9"/>
<circle cx="405" cy="290" r="5" fill="#20394a"/>
<path d="M443 290A38 38 0 0 0 424 257.09" fill="none" stroke="#b63535" stroke-width="2"/>
<text x="446" y="272" fill="#9b2929" font-size="23">60°</text>
<text x="540" y="145" font-size="20" fill="#9b2929">erő működésének iránya</text>
<path d="M530 158L500 170" stroke="#9b2929" stroke-width="2"/>
<text x="565" y="330" font-size="21" fill="#246440">hatásvonal</text>
<path d="M615 338V358" stroke="#246440" stroke-width="2"/>
<text x="170" y="460" font-size="24" fill="#9b2929">F = 1 kN</text>
<text x="150" y="493" font-size="18" fill="#9b2929">erő nagysága</text>
<text x="40" y="536" font-size="18">A feliratok a füzetből származnak; további erőértéket nem adnak meg.</text>
</g></svg>