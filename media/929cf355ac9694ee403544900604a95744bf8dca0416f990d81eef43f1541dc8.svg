<text x="586" y="420.229" font-size="23" font-weight="700" text-anchor="start" fill="#b74d2f">8,65</text>
<text x="442.2" y="452.229" font-size="23" font-weight="400" text-anchor="middle" fill="#b74d2f">lehűl, a pára</text>
<text x="442.2" y="478.229" font-size="23" font-weight="400" text-anchor="middle" fill="#b74d2f">mennyisége</text>
<text x="442.2" y="504.229" font-size="23" font-weight="400" text-anchor="middle" fill="#b74d2f">nem változik</text>
<circle cx="305.32" cy="412.229" r="9" fill="#ffffff" stroke="#b74d2f" stroke-width="3.5"/>
<path d="M305.32 422.229 L305.32 560" fill="none" stroke="#b74d2f" stroke-width="2" stroke-dasharray="6 6"/>
<text x="291.32" y="328.229" font-size="23" font-weight="700" text-anchor="end" fill="#b74d2f">harmatpont</text>
<text x="291.32" y="354.229" font-size="23" font-weight="700" text-anchor="end" fill="#b74d2f">kb. 9 °C</text>
<text x="586" y="446.229" font-size="23" font-weight="400" text-anchor="start" fill="#b74d2f">φ = 50%</text>
<text x="30" y="660" font-size="22" font-weight="400" text-anchor="start" fill="#243747">Példa: 20 °C, 8,65 g/m³ → φ = 8,65 / 17,3 = 50%.</text>
<text x="30" y="690" font-size="22" font-weight="400" text-anchor="start" fill="#243747">Kb. 9 °C-ra hűlve telítetté válik; ha tovább hűl,</text>
<text x="30" y="720" font-size="22" font-weight="400" text-anchor="start" fill="#243747">a felesleges pára lecsapódik.</text>
