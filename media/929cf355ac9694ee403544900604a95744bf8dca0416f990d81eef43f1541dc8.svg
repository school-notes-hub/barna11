<text x="326" y="387.417" font-size="23" font-weight="700" text-anchor="end" fill="#196c9c">9,4</text>
<circle cx="572" cy="264.458" r="7" fill="#196c9c" stroke="none" stroke-width="2"/>
<text x="586" y="252.458" font-size="23" font-weight="700" text-anchor="start" fill="#196c9c">17,3</text>
<path d="M572 412.229 L572 560" fill="none" stroke="#62788a" stroke-width="2" stroke-dasharray="6 6"/>
