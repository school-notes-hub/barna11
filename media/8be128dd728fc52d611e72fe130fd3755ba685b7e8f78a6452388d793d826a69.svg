<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315663"/></marker></defs><rect width="900" height="960" rx="20" fill="#faf7ef"/><text x="450.0" y="45" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#183d48">Mi akadályozza a korszerűsítést?</text><text x="450.0" y="84" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#183d48">Széchenyi: Hitel, 1830</text><rect x="50" y="120" width="800" height="100" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="450.0" y="180.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#183d48">Nagy birtok, de kevés fejlesztési pénz.</text><path d="M450,225 L450,275" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="490" y="257" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#183d48">miért?</text><rect x="80" y="285" width="760" height="120" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="460.0" y="337.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#183d48">Nehéz hitelhez jutni:</text><text x="460.0" y="373.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" fill="#183d48">a birtok bizonytalan hitelfedezet.</text><path d="M450,410 L450,462" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="490" y="443" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#183d48">ennek oka</text><rect x="110" y="475" width="700" height="120" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="460.0" y="527.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#183d48">Ősiség (1351): korlátozott</text><text x="460.0" y="563.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" fill="#183d48">az öröklött birtok szabad eladása.</text><path d="M450,600 L450,652" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="490" y="633" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#183d48">következmény</text><rect x="140" y="665" width="640" height="115" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="460.0" y="714.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#183d48">A kölcsönadó nehezebben</text><text x="460.0" y="750.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" fill="#183d48">juthat a fedezet értékéhez.</text><path d="M450,787 L450,839" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="490" y="820" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#183d48">javaslat</text><rect x="100" y="850" width="700" height="75" rx="12" fill="#f3e3d5" stroke="#81969b" stroke-width="1.5"/><text x="450.0" y="897.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#183d48">Az ősiség eltörlése.</text></svg>