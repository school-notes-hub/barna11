<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title"><title id="title">Savas, semleges és lúgos tartomány; a szín csak szemléltető elkülönítés</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="310" rx="12" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif"><text x="320" y="37" font-size="23" text-anchor="middle" fill="#263548">Kémhatás vizes oldatban, kb. 25 °C-on</text><rect x="30" y="100" width="290" height="55" rx="5" fill="#f5b9a3" stroke="#8395a2"/><rect x="320" y="100" width="290" height="55" rx="5" fill="#b9c9ed" stroke="#8395a2"/><path d="M320 95 L320 168" stroke="#267058" stroke-width="3" fill="none"/><text x="155" y="138" font-size="23" text-anchor="middle" fill="#263548">savas</text><text x="320" y="192" font-size="20" text-anchor="middle" fill="#263548">semleges</text><text x="485" y="138" font-size="23" text-anchor="middle" fill="#263548">lúgos</text><text x="38" y="87" font-size="22" text-anchor="start" fill="#263548">0</text><text x="320" y="87" font-size="22" text-anchor="middle" fill="#263548">7</text><text x="600" y="87" font-size="22" text-anchor="end" fill="#263548">14</text><text x="320" y="244" font-size="20" text-anchor="middle" fill="#263548">A színek itt tartományokat különítenek el.</text><text x="320" y="277" font-size="20" text-anchor="middle" fill="#263548">Nem indikátorpapírhoz használható színminta.</text></g></svg>