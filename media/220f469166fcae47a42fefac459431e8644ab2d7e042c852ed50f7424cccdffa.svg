<text x="237.0" y="505.0" font-family="Arial, sans-serif" font-size="23" fill="#8a4a12" font-weight="700">Tömegből erő: nem átváltás,</text>
<text x="237.0" y="535.0" font-family="Arial, sans-serif" font-size="23" fill="#8a4a12" font-weight="700">hanem számolás: G = m · g</text>
<text x="237.0" y="565.0" font-family="Arial, sans-serif" font-size="22" fill="#8a4a12">g ≈ 10 m/s², így 1 kg súlya kb. 10 N</text>
<text x="28.0" y="772.0" font-family="Arial, sans-serif" font-size="22" fill="#243746">Előbb a tömeget váltsd kilogrammra, csak azután szorozz g-vel.</text>
