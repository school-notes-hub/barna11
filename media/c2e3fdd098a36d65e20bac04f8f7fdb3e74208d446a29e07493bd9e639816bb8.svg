<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315663"/></marker></defs><rect width="900" height="1120" rx="18" fill="#faf7ef"/><text x="450" y="48" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#183d48">Nemzetiségi kérdés</text><text x="450" y="94" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Soknemzetiségű Magyarország, reformkor</text><rect x="20" y="180" width="265" height="280" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="152.5" y="268.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" fill="#183d48">Például:</text><text x="152.5" y="310.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" fill="#183d48">Románok</text><text x="152.5" y="352.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" fill="#183d48">Horvátok</text><text x="152.5" y="394.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" fill="#183d48">Szerbek</text><path d="M295 205 H315 V438 H295" fill="none" stroke="#315663" stroke-width="3"/><path d="M315 324 H455" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="390" y="286" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" fill="#183d48">igényeik:</text><rect x="465" y="175" width="415" height="350" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="672.5" y="300.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Saját nemzeti eszme</text><text x="672.5" y="340.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Saját nyelvhasználat</text><text x="672.5" y="380.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">és intézmények</text><text x="672.5" y="420.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Közösségi jogok</text><rect x="20" y="745" width="645" height="225" rx="12" fill="#f3e4d6" stroke="#81969b" stroke-width="1.5"/><text x="342.5" y="828.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">A magyar liberális elit többsége:</text><text x="342.5" y="868.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">egyéni jogegyenlőség,</text><text x="342.5" y="908.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">egységes politikai nemzet</text><path d="M670 857 H804 V539" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><text x="635" y="598" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">a külön közösségi</text><text x="635" y="640" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">jogokat nem</text><text x="635" y="682" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">ismerte el</text><text x="450" y="1045" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="700" fill="#183d48">Ebből feszültségek alakultak ki.</text></svg>