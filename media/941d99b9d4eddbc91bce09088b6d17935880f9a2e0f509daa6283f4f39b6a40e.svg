<svg xmlns="http://www.w3.org/2000/svg" width="640" height="755" viewBox="0 0 640 755" role="img" aria-labelledby="title"><title id="title">Golyóbenyomódás és koptatás önálló elvi ábrái</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="755" rx="12" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif"><text x="25" y="35" font-size="25" text-anchor="start" fill="#263548">Benyomódás</text><rect x="90" y="197" width="460" height="80" rx="5" fill="#d4e0e8" stroke="#8395a2"/><path d="M90 197 H276 Q320 243 364 197 H550" stroke="#263548" stroke-width="3" fill="none"/><circle cx="320" cy="170" r="48" fill="#94b1c3" stroke="#263548" stroke-width="2"/><path d="M320 60 L320 114" stroke="#b64829" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="344" y="91" font-size="21" text-anchor="start" fill="#263548">terhelés</text><text x="320" y="317" font-size="21" text-anchor="middle" fill="#263548">A lenyomat mérete jellemzi az ellenállást.</text><text x="25" y="391" font-size="25" text-anchor="start" fill="#263548">Koptatás elve</text><ellipse cx="320" cy="577" rx="228" ry="75" fill="#d4e0e8" stroke="#8395a2"/><rect x="277" y="454" width="85" height="69" rx="5" fill="#cbb593" stroke="#8395a2"/><path d="M320 404 L320 446" stroke="#b64829" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="370" y="452" font-size="21" text-anchor="start" fill="#263548">próbatest</text><path d="M132 584 C175 636 440 644 514 590" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="686" font-size="21" text-anchor="middle" fill="#263548">Forgó felület + terhelés → anyagveszteség</text><text x="320" y="724" font-size="19" text-anchor="middle" fill="#263548">Elvi szemléltetés, nem teljes géprajz.</text></g></svg>