<svg xmlns="http://www.w3.org/2000/svg" width="640" height="385" viewBox="0 0 640 385" role="img" aria-labelledby="title"><title id="title">Páravándorlás jobbról balra, a nagyobb résznyomás felől</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="385" rx="12" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif"><text x="320" y="36" font-size="25" text-anchor="middle" fill="#263548">Páradiffúzió a füzet példájában</text><rect x="263" y="80" width="114" height="230" rx="5" fill="#e0e9d6" stroke="#8395a2"/><text x="320" y="68" font-size="21" text-anchor="middle" fill="#263548">fal</text><text x="122" y="122" font-size="23" text-anchor="middle" fill="#263548">Külső tér</text><text x="122" y="158" font-size="24" text-anchor="middle" fill="#263548">+5 °C</text><text x="518" y="122" font-size="23" text-anchor="middle" fill="#263548">Belső tér</text><text x="518" y="158" font-size="24" text-anchor="middle" fill="#263548">+25 °C</text><text x="122" y="258" font-size="22" text-anchor="middle" fill="#263548">kisebb</text><text x="122" y="287" font-size="21" text-anchor="middle" fill="#263548">páranyomás</text><text x="518" y="258" font-size="22" text-anchor="middle" fill="#263548">nagyobb</text><text x="518" y="287" font-size="21" text-anchor="middle" fill="#263548">páranyomás</text><path d="M500 208 L140 208" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="355" font-size="21" text-anchor="middle" fill="#263548">Az irányt a páranyomás különbsége adja.</text></g></svg>