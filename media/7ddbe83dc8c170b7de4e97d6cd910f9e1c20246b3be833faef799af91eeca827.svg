<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-labelledby="title desc"><title id="title">Kötelek és megtámasztó rudak</title><desc id="desc">Saját ábra a füzet 14. oldalának látható rajza alapján. A 75 fokos szög és az egyenletes teher felezőpontja feloldva. Az A kötél kN-egysége és a B rúd 808,1 N erőnagysága a füzet számításából átvett adat; a felső adatsor hiányát a kísérőszöveg rögzíti.</desc><defs>
