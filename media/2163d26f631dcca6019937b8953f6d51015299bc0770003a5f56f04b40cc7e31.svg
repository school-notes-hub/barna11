<svg xmlns="http://www.w3.org/2000/svg" width="720" height="910" viewBox="0 0 720 910" role="img" aria-labelledby="title desc">
<title id="title">Erőkar és rúdhossz megkülönböztetése</title><desc id="desc">Pontos saját szemléltetés. Felső eset: vízszintes OP rúd, P-ben jobbra-felfelé mutató erő; az O pontból az erő hatásvonalára bocsátott merőleges adja a erőkarhosszt, amely kisebb L rúdhossznál. Alsó eset: az erő hatásvonala átmegy O-n, az erőkar és nyomaték nulla.</desc>
<defs><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<rect width="720" height="910" rx="18" fill="#f5f9fc"/>
<text x="28" y="42" font-family="Arial, sans-serif" font-size="26" fill="#243746" font-weight="700">Az erőkar hossza: merőleges távolság</text>
<text x="28" y="77" font-family="Arial, sans-serif" font-size="20" fill="#243746">O: forgáspont · P: az erő támadáspontja</text>
<text x="28" y="110" font-family="Arial, sans-serif" font-size="20" fill="#243746">F: az erő nagysága · L: rúdhossz · a: erőkarhossz</text>
<text x="28" y="160" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="700">1. Ferde erő: az erőkar rövidebb a rúdnál</text>
<line x1="100" y1="260" x2="520" y2="260" stroke="#243746" stroke-width="9"/>
<line x1="255" y1="525" x2="655" y2="125" stroke="#b62d3b" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="520" y1="260" x2="620" y2="160" stroke="#b62d3b" stroke-width="4" marker-end="url(#force)"/>
<text x="625" y="184" font-family="Arial, sans-serif" font-size="25" fill="#b62d3b">F</text>
<line x1="100" y1="260" x2="310" y2="470" stroke="#087b68" stroke-width="4"/>
<circle cx="100" cy="260" r="6" fill="white" stroke="#243746" stroke-width="3"/>
<circle cx="520" cy="260" r="6" fill="white" stroke="#243746" stroke-width="3"/>
<text x="73" y="244" font-family="Arial, sans-serif" font-size="22" fill="#243746">O</text>
<text x="530" y="285" font-family="Arial, sans-serif" font-size="22" fill="#243746">P</text>
<text x="164" y="376" font-family="Arial, sans-serif" font-size="25" fill="#087b68" font-weight="700">a</text>
<polyline points="295.86,455.86 310,441.72 324.14,455.86" fill="none" stroke="#087b68" stroke-width="2"/>
<text x="304" y="499" font-family="Arial, sans-serif" font-size="19" fill="#087b68">90°</text>
<line x1="100" y1="220" x2="520" y2="220" stroke="#245c90" stroke-width="2"/>
<line x1="100" y1="213" x2="100" y2="227" stroke="#245c90" stroke-width="2"/>
<line x1="520" y1="213" x2="520" y2="227" stroke="#245c90" stroke-width="2"/>
<text x="296" y="208" font-family="Arial, sans-serif" font-size="23" fill="#245c90">L</text>
<text x="393" y="449" font-family="Arial, sans-serif" font-size="19" fill="#b62d3b">Az erő hatásvonala</text>
<line x1="387" y1="442" x2="344" y2="436" stroke="#b62d3b" stroke-width="1.5"/>
<text x="28" y="553" font-family="Arial, sans-serif" font-size="21" fill="#087b68">a: az O ponttól az erő hatásvonaláig</text>
<text x="28" y="583" font-family="Arial, sans-serif" font-size="21" fill="#087b68">mért merőleges távolság. Itt a &lt; L.</text>
<line x1="28" y1="637" x2="692" y2="637" stroke="#bac9d2" stroke-width="1"/>
<text x="28" y="680" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="700">2. A hatásvonal átmegy a forgásponton</text>
<line x1="70" y1="760" x2="645" y2="760" stroke="#b62d3b" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="100" y1="760" x2="520" y2="760" stroke="#243746" stroke-width="9"/>
<line x1="520" y1="760" x2="640" y2="760" stroke="#b62d3b" stroke-width="4" marker-end="url(#force)"/>
<circle cx="100" cy="760" r="6" fill="white" stroke="#243746" stroke-width="3"/>
<circle cx="520" cy="760" r="6" fill="white" stroke="#243746" stroke-width="3"/>
<text x="82" y="731" font-family="Arial, sans-serif" font-size="22" fill="#243746">O</text>
<text x="506" y="800" font-family="Arial, sans-serif" font-size="22" fill="#243746">P</text>
<text x="599" y="737" font-family="Arial, sans-serif" font-size="25" fill="#b62d3b">F</text>
<text x="28" y="843" font-family="Arial, sans-serif" font-size="22" fill="#087b68" font-weight="700">Az erőkar hossza a = 0, ezért M = 0.</text>
<text x="28" y="880" font-family="Arial, sans-serif" font-size="19" fill="#243746">Az erőnek ekkor nincs forgató hatása az O pontra.</text>
</svg>