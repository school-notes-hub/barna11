<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1225" viewBox="0 0 900 1225"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315663"/></marker></defs><rect width="900" height="1225" rx="18" fill="#faf7ef"/><text x="450" y="48" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#183d48">A jobbágyság rétegei</text><text x="450" y="94" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Magyarország, 19. század eleje</text><rect x="70" y="140" width="290" height="130" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="215.0" y="215.85" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Telkes jobbágy</text><path d="M365 205.0 H415" fill="none" stroke="#315663" stroke-width="4" marker-end="url(#a)"/><rect x="425" y="140" width="455" height="130" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="652.5" y="179" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Jobbágytelket használ</text><rect x="70" y="330" width="290" height="195" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="215.0" y="438.35" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Házas zsellér</text><path d="M365 427.5 H415" fill="none" stroke="#315663" stroke-width="4" marker-end="url(#a)"/><rect x="425" y="330" width="455" height="195" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="652.5" y="398.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Nincs jobbágytelke;</text><text x="652.5" y="438.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">van saját háza,</text><text x="652.5" y="478.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">gyakran bérmunkát vállal</text><rect x="70" y="580" width="290" height="220" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="215.0" y="700.85" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Házatlan zsellér</text><path d="M365 690.0 H415" fill="none" stroke="#315663" stroke-width="4" marker-end="url(#a)"/><rect x="425" y="580" width="455" height="220" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="652.5" y="640.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Sem saját háza,</text><text x="652.5" y="680.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">sem jobbágytelke nincs;</text><text x="652.5" y="720.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">bérmunkából is élhet,</text><text x="652.5" y="760.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">például béresként</text><path d="M70 220 H30 V1005 H450 V1010" fill="none" stroke="#315663" stroke-width="4" marker-end="url(#a)"/><text x="450" y="867" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#183d48">Robotot végeztek a majorságban:</text><text x="450" y="909" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">a földesúrnak munkával tartoztak.</text><rect x="70" y="1020.0" width="810" height="185" rx="12" fill="#f3e4d6" stroke="#81969b" stroke-width="1.5"/><text x="475.0" y="1083.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Majorság: a földesúr saját kezelésű gazdasága.</text><text x="475.0" y="1123.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Jobbágyok robotjával, később bérmunkásokkal</text><text x="475.0" y="1163.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">is művelték; a termést piacra vitték.</text><path d="M70 427.5 H30" fill="none" stroke="#315663" stroke-width="4"/><path d="M70 690 H30" fill="none" stroke="#315663" stroke-width="4"/><text x="450" y="952" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#183d48">Mértéke a telek nagyságától és attól függött,</text><text x="652.5" y="216" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">(egészet vagy annak</text><text x="652.5" y="253" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">egy részét)</text><text x="450" y="988" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#183d48">hogy a zsellér házas vagy házatlan volt.</text></svg>