<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1340" viewBox="0 0 720 1340" role="img" aria-labelledby="title desc"><title id="title">Támaszok helyettesítése erőkkel</title><desc id="desc">Hat sor: balra egy ideális síkbeli támasz, jobbra az erő, amellyel a támasz a testre hat. Kötél: húzóerő a kötél vonalában, a testtől elfelé. Támasztórúd: erő a rúd tengelye mentén, húzás vagy nyomás. Görgő: a támaszfelületre merőleges erő; ferde felületen a ferde felületre merőleges. Csukló: két erőkomponens. Merev befogás: két erőkomponens és egy reakciónyomaték.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#243746" stroke-width="1.8"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#c43d42" stroke-width="1.8"/></marker><marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#16816b" stroke-width="1.8"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2a64a8" stroke-width="1.8"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#546b80" stroke-width="1.8"/></marker><marker id="brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b5651d" stroke-width="1.8"/></marker></defs><rect width="720" height="1340" rx="18" fill="#f5f9fc"/>
<text x="28.0" y="44.0" font-family="Arial, sans-serif" font-size="28" fill="#243746" font-weight="700">Támaszok helyettesítése erőkkel</text>
<text x="28.0" y="80.0" font-family="Arial, sans-serif" font-size="23" fill="#243746">Balra a támasz, jobbra az erő, amellyel a testre hat.</text>
<text x="28.0" y="128.0" font-family="Arial, sans-serif" font-size="24" fill="#243746" font-weight="700">1. Kötél</text>
<text x="28.0" y="286.0" font-family="Arial, sans-serif" font-size="23" fill="#243746">Húzóerő a kötél vonalában, a testtől elfelé.</text>
