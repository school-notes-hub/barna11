<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1165" viewBox="0 0 640 1165" role="img" aria-labelledby="title"><title id="title">Húzás és nyomás erőnyilai, nyírás iránya, hajlítás és csavarás alakváltozása</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="1165" rx="12" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif"><text x="25" y="35" font-size="26" text-anchor="start" fill="#263548">Öt alapigénybevétel</text><text x="25" y="75" font-size="23" text-anchor="start" fill="#263548">Húzás</text><rect x="176" y="100" width="290" height="40" rx="5" fill="#e6edf2" stroke="#8395a2"/><path d="M175 120 L82 120" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M467 120 L565 120" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="25" y="220" font-size="23" text-anchor="start" fill="#263548">Nyomás</text><rect x="176" y="245" width="290" height="40" rx="5" fill="#e6edf2" stroke="#8395a2"/><path d="M82 265 L172 265" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M565 265 L470 265" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="25" y="380" font-size="23" text-anchor="start" fill="#263548">Nyírás – két szomszédos metszet</text><rect x="125" y="415" width="190" height="42" rx="5" fill="#e6edf2" stroke="#8395a2"/><rect x="320" y="445" width="190" height="42" rx="5" fill="#e6edf2" stroke="#8395a2"/><path d="M310 438 L310 396" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M327 495 L327 541" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="581" font-size="21" text-anchor="middle" fill="#263548">A két rész elcsúsztatására törekszik.</text><text x="25" y="646" font-size="23" text-anchor="start" fill="#263548">Hajlítás – a tengely meggörbül</text><path d="M130 695 Q320 790 510 695" stroke="#263548" stroke-width="3" fill="none"/><path d="M130 733 Q320 828 510 733" stroke="#263548" stroke-width="3" fill="none"/><path d="M130 695 L130 733" stroke="#263548" stroke-width="3" fill="none"/><path d="M510 695 L510 733" stroke="#263548" stroke-width="3" fill="none"/><text x="320" y="838" font-size="20" text-anchor="middle" fill="#263548">Az alakváltozást szemléltetjük.</text><text x="25" y="904" font-size="22" text-anchor="start" fill="#263548">Csavarás – elfordulás a hossztengely körül</text><path d="M170 998 L480 998" stroke="#a0aeb8" stroke-width="3" fill="none"/><rect x="126" y="962" width="73" height="73" rx="5" fill="#d4e0e8" stroke="#8395a2"/><path d="M462 947 L514 998 L462 1049 L410 998Z" fill="#b5cbd8" stroke="#263548"/><path d="M199 962 L462 947" stroke="#263548" stroke-width="3" fill="none"/><path d="M199 1035 L462 1049" stroke="#263548" stroke-width="3" fill="none"/><path d="M524 950 Q565 999 526 1044" stroke="#18628a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="1106" font-size="20" text-anchor="middle" fill="#263548">A végkeresztmetszetek egymáshoz</text><text x="320" y="1135" font-size="20" text-anchor="middle" fill="#263548">képest elfordulnak (túlzó szemléltetés).</text></g></svg>