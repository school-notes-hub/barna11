<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1390" viewBox="0 0 900 1390"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315663"/></marker></defs><rect width="900" height="1390" rx="18" fill="#faf7ef"/><text x="450" y="46" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#183d48">A nemesség rétegei</text><text x="450" y="92" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#183d48">és a városi polgárság</text><text x="450" y="137" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Magyarország, 19. század eleje</text><rect x="20" y="165" width="805" height="1010" rx="12" fill="#edf1ec" stroke="#81969b" stroke-width="1.5"/><text x="420" y="208" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#183d48">1. Nemesség</text><rect x="50" y="235" width="745" height="150" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="422.5" y="267" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Arisztokrácia = főnemesség</text><text x="422.5" y="301" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Nagybirtokok; korszerű</text><text x="422.5" y="369" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">sokan az udvarhoz kötődtek.</text><path d="M235 398 V475" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/><text x="260" y="425" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">Eltérő politikai</text><text x="260" y="464" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">kötődés</text><rect x="50" y="490" width="745" height="210" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="422.5" y="544.35" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Középbirtokos nemesség</text><text x="422.5" y="585.35" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Vármegyék irányítása; egy része tanult,</text><text x="422.5" y="626.35" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">polgárosodott és nyitott a reformokra;</text><text x="422.5" y="667.35" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">sokan elszegényedtek.</text><rect x="50" y="995" width="745" height="150" rx="12" fill="#e4edf0" stroke="#81969b" stroke-width="1.5"/><text x="422.5" y="1039.85" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Kisnemesség</text><text x="422.5" y="1080.85" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">Hétszilvafás, bocskoros nemesek;</text><text x="422.5" y="1121.85" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">szerény birtok vagy birtoktalanság.</text><path d="M422 700 V754" fill="none" stroke="#315663" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="765" width="745" height="180" rx="12" fill="#fff8e7" stroke="#81969b" stroke-width="1.5"/><text x="415" y="819.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#183d48">Középbirtokos nemesek egy része:</text><text x="415" y="861.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">városba költözött, polgári munkát vállalt;</text><text x="415" y="903.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#183d48">nemesi jogállása megmaradt.</text><rect x="20" y="1210" width="790" height="160" rx="12" fill="#f3e4d6" stroke="#81969b" stroke-width="1.5"/><text x="415.0" y="1280.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#183d48">2. Városi polgárság</text><text x="415.0" y="1322.2" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" fill="#183d48">Kézművesek, kereskedők, vállalkozók</text><text x="422.5" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" fill="#183d48">birtokgazdálkodás; magas méltóságok;</text></svg>