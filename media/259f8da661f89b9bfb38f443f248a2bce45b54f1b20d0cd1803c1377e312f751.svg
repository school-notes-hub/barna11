<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">A csuklós kar forgató hatása</title><desc id="desc">Csuklós kar: a bal oldali csuklótól ferdén felfelé álló kar szabad végén függőlegesen lefelé ható F erő. Az íves nyíl a csukló körüli, az óramutató járásával egyező elfordulást, a szaggatott vonal az elfordult helyzetet mutatja.</desc><defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#243746" stroke-width="1.6"/></marker>
